<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chúc Mừng Sinh Nhật!</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-rose: #DE7272;
            --pastel-orange: #FFCA88;
            --pastel-yellow: #FFF6A9;
            --mint-green: #B4E4D6;
            --bg-white: #FFFFFF;
            --text-brown: #5C4033;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-white);
            color: var(--text-brown);
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            transition: opacity 0.5s ease;
            background: radial-gradient(circle, #ffffff 60%, var(--pastel-yellow) 100%);
        }

        .hidden {
            opacity: 0;
            pointer-events: none;
            display: none !important;
        }

        /* MÀN HÌNH 1: LẮC ĐIỆN THOẠI */
        #screen-1 {
            text-align: center;
        }

        .waterflower-container {
            position: relative;
            width: 100%;
            height: 60vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .floating-flower {
            position: absolute;
            width: 120px;
            height: 120px;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="20" fill="%23FFCA88"/><path d="M50 10 Q55 30 50 40 Q45 30 50 10" fill="%23FFF6A9"/><path d="M50 90 Q55 70 50 60 Q45 70 50 90" fill="%23FFF6A9"/><path d="M10 50 Q30 55 40 50 Q30 45 10 50" fill="%23FFF6A9"/><path d="M90 50 Q70 55 60 50 Q70 45 90 50" fill="%23FFF6A9"/></svg>');
            background-size: contain;
            background-repeat: no-repeat;
            transition: transform 0.1s ease-out;
        }

        .instruction-text {
            font-size: 14px;
            color: var(--text-brown);
            margin-top: 20px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .permission-btn {
            margin-top: 15px;
            background-color: var(--primary-rose);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: 600;
            font-family: 'Montserrat', sans-serif;
            box-shadow: 0 4px 10px rgba(222, 114, 114, 0.3);
        }

        /* MÀN HÌNH 2: TRỒNG CÂY */
        #screen-2 {
            background: linear-gradient(to bottom, #ffffff 70%, var(--mint-green) 100%);
        }

        .soil-area {
            position: relative;
            width: 250px;
            height: 250px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }

        .plant-stage {
            max-width: 180px;
            max-height: 180px;
            transition: all 0.8s ease;
            transform-origin: bottom center;
        }

        .watering-can {
            position: absolute;
            right: -30px;
            top: 50px;
            width: 70px;
            cursor: pointer;
            touch-action: none;
            transition: transform 0.2s;
            filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.1));
        }

        /* MÀN HÌNH 3: BÁNH KEM & THỔI NẾN */
        #screen-3 {
            background-color: #fffaf0;
            text-align: center;
        }

        .sun-rays {
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: conic-gradient(var(--pastel-orange) 0deg 45deg, var(--pastel-yellow) 45deg 90deg, var(--mint-green) 90deg 135deg, var(--primary-rose) 135deg 180deg);
            animation: spin 10s linear infinite;
            z-index: 1;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .cake-wrapper {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .birthday-cake {
            width: 220px;
            border-radius: 20px;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.15));
        }

        .friend-avatar {
            position: absolute;
            top: -60px;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--primary-rose);
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            animation: float-face 3s ease-in-out infinite;
        }

        @keyframes float-face {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .candle {
            position: absolute;
            top: -30px;
            width: 12px;
            height: 40px;
            background: var(--primary-rose);
            border-radius: 4px;
        }

        .flame {
            position: absolute;
            top: -15px;
            left: -4px;
            width: 20px;
            height: 25px;
            background: radial-gradient(circle, #fff 20%, #ffaa00 60%, #ff3300 100%);
            border-radius: 50% 50% 20% 20%;
            animation: flicker 0.5s infinite alternate;
        }

        @keyframes flicker {
            0% { transform: scale(1); opacity: 0.9; }
            100% { transform: scale(1.1); opacity: 1; filter: drop-shadow(0 0 8px #ffaa00); }
        }

        .note-card {
            margin-top: 20px;
            background: #fff;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(92, 64, 51, 0.15);
            max-width: 320px;
            border-left: 6px solid var(--primary-rose);
            z-index: 2;
            transform: scale(0);
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .note-card.show {
            transform: scale(1);
        }

        .note-card h3 {
            color: var(--primary-rose);
            margin-bottom: 8px;
            font-size: 18px;
        }

        .note-card p {
            font-size: 14px;
            line-height: 1.5;
            color: var(--text-brown);
        }

        /* HIỆU ỨNG KHÓI VÀ NỔ */
        .explosion {
            position: absolute;
            width: 150px;
            height: 150px;
            background: radial-gradient(circle, rgba(255,255,255,0.9) 0%, rgba(255,202,136,0.6) 50%, transparent 80%);
            border-radius: 50%;
            animation: explode 0.6s forwards;
            pointer-events: none;
            z-index: 10;
        }

        @keyframes explode {
            0% { transform: scale(0.2); opacity: 1; }
            100% { transform: scale(2.5); opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- MÀN HÌNH 1: LẮC ĐIỆN THOẠI -->
    <div id="screen-1" class="screen">
        <div class="waterflower-container" id="flower-container">
            <div class="floating-flower" style="top: 20%; left: 20%;"></div>
            <div class="floating-flower" style="top: 50%; left: 70%;"></div>
            <div class="floating-flower" style="top: 70%; left: 35%;"></div>
        </div>
        <p class="instruction-text">"Lắc lên lắc xuống 5 lần"</p>
        <button class="permission-btn" id="start-motion-btn">Bắt đầu tương tác</button>
    </div>

    <!-- MÀN HÌNH 2: TRỒNG CÂY -->
    <div id="screen-2" class="screen hidden">
        <p class="instruction-text" style="margin-bottom: 20px;">Dùng bình nước tưới cho ụ đất nhé!</p>
        <div class="soil-area" id="soil-area">
            <!-- Cây thay đổi theo tiến trình -->
            <svg id="plant-svg" class="plant-stage" viewBox="0 0 100 100">
                <ellipse cx="50" cy="90" rx="30" ry="10" fill="#DE7272" opacity="0.3"/>
                <!-- Mầm cây ban đầu -->
                <path id="plant-path" d="M50 90 Q50 70 50 60" stroke="#B4E4D6" stroke-width="4" fill="none" stroke-linecap="round"/>
                <circle id="plant-bud" cx="50" cy="58" r="6" fill="#FFCA88"/>
            </svg>
            <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 50 50'><path d='M10 30 Q15 10 35 15 Q40 25 30 40 Z' fill='%23B4E4D6'/></svg>" class="watering-can" id="watering-can" alt="Bình nước">
        </div>
    </div>

    <!-- MÀN HÌNH 3: BÁNH KEM & THỔI NẾN -->
    <div id="screen-3" class="screen hidden">
        <div class="sun-rays hidden" id="sun-rays"></div>
        <div class="cake-wrapper" id="cake-wrapper">
            <!-- Thay đường dẫn ảnh khuôn mặt bạn của bạn vào src bên dưới -->
            <img src="1792418260539_214372949393559973_5289422467740795963_275e1aea42606f24d1391e19455d1a39.jpg" class="friend-avatar" alt="Khuôn mặt">
            <div style="position: relative;">
                <div class="candle" id="candle"><div class="flame" id="flame"></div></div>
                <!-- Bánh kem hoa hướng dương phong cách màu nước kết hợp Thiên Bình -->
                <svg class="birthday-cake" viewBox="0 0 200 180">
                    <path d="M40 140 C40 110 160 110 160 140 L150 170 C150 175 50 175 50 170 Z" fill="#FFF6A9"/>
                    <path d="M30 110 C30 90 170 90 170 110 L160 140 C160 145 40 145 40 140 Z" fill="#FFCA88"/>
                    <!-- Trang trí hoa hướng dương & ký hiệu Thiên Bình (♎) -->
                    <circle cx="100" cy="115" r="18" fill="#DE7272"/>
                    <text x="94" y="122" font-size="16" fill="white" font-weight="bold">♎</text>
                </svg>
            </div>
        </div>

        <div class="note-card" id="note-card">
            <h3>Chúc Mừng Sinh Nhật! 🌻</h3>
            <p id="wish-text">Chúc bạn tuổi mới luôn rực rỡ như hoa hướng dương, ngập tràn năng lượng tích cực, mọi điều ước đều thành sự thật và luôn mỉm cười thật tươi nhé!</p>
        </div>
    </div>

    <!-- Âm thanh nhạc sinh nhật (tùy chọn) -->
    <audio id="bday-audio" loop src="https://www.bensound.com/bensound-music/bensound-cute.mp3"></audio>

    <script>
        // --- XỬ LÝ MÀN HÌNH 1: LẮC ĐIỆN THOẠI ---
        let shakeCount = 0;
        const targetShakes = 5;
        let lastY = 0;
        let lastTime = 0;

        const startBtn = document.getElementById('start-motion-btn');
        startBtn.addEventListener('click', () => {
            if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
                DeviceMotionEvent.requestPermission().then(response => {
                    if (response === 'granted') {
                        window.addEventListener('devicemotion', handleMotion);
                    }
                }).catch(console.error);
            } else {
                window.addEventListener('devicemotion', handleMotion);
            }
            startBtn.textContent = "Hãy lắc điện thoại đi nào!";
        });

        function handleMotion(e) {
            const currentY = e.accelerationIncludingGravity.y;
            const currentTime = new Date().getTime();
            
            if ((currentTime - lastTime) > 300) {
                const diffY = Math.abs(currentY - lastY);
                if (diffY > 12) {
                    shakeCount++;
                    animateFlowers();
                    if (shakeCount >= targetShakes) {
                        window.removeEventListener('devicemotion', handleMotion);
                        triggerExplosion(window.innerWidth / 2, window.innerHeight / 2, transitionToScreen2);
                    }
                }
                lastY = currentY;
                lastTime = currentTime;
            }
        }

        function animateFlowers() {
            const flowers = document.querySelectorAll('.floating-flower');
            flowers.forEach(f => {
                const randomX = (Math.random() - 0.5) * 100;
                const randomY = (Math.random() - 0.5) * 100;
                f.style.transform = `translate(${randomX}px, ${randomY}px) rotate(${Math.random() * 360}deg)`;
            });
        }

        function triggerExplosion(x, y, callback) {
            const exp = document.createElement('div');
            exp.className = 'explosion';
            exp.style.left = `${x - 75}px`;
            exp.style.top = `${y - 75}px`;
            document.body.appendChild(exp);
            setTimeout(() => {
                exp.remove();
                if (callback) callback();
            }, 500);
        }

        function transitionToScreen2() {
            document.getElementById('screen-1').classList.add('hidden');
            document.getElementById('screen-2').classList.remove('hidden');
            initPlantGame();
        }

        // --- XỬ LÝ MÀN HÌNH 2: TRỒNG CÂY ---
        let plantStageLevel = 0;
        const can = document.getElementById('watering-can');
        const plantSvg = document.getElementById('plant-svg');

        function initPlantGame() {
            let isDragging = false;

            can.addEventListener('pointerdown', () => isDragging = true);
            window.addEventListener('pointerup', () => isDragging = false);
            window.addEventListener('pointermove', (e) => {
                if (!isDragging) return;
                const soilRect = document.getElementById('soil-area').getBoundingClientRect();
                if (Math.abs(e.clientX - (soilRect.left + soilRect.width/2)) < 80) {
                    waterPlant();
                }
            });

            // Tự động tiến hóa sau mỗi 3 giây nếu người dùng không kéo
            setInterval(() => {
                if(plantStageLevel < 3) {
                    waterPlant();
                }
            }, 3000);
        }

        function waterPlant() {
            plantStageLevel++;
            if (plantStageLevel === 1) {
                plantSvg.innerHTML = `<ellipse cx="50" cy="90" rx="30" ry="10" fill="#DE7272" opacity="0.3"/><path d="M50 90 Q40 60 50 40" stroke="#B4E4D6" stroke-width="5" fill="none" stroke-linecap="round"/><circle cx="50" cy="38" r="12" fill="#FFF6A9"/>`;
            } else if (plantStageLevel === 2) {
                plantSvg.innerHTML = `<ellipse cx="50" cy="90" rx="30" ry="10" fill="#DE7272" opacity="0.3"/><path d="M50 90 Q30 50 50 20" stroke="#B4E4D6" stroke-width="6" fill="none" stroke-linecap="round"/><path d="M45 60 Q30 50 35 40" fill="#B4E4D6"/><path d="M55 50 Q70 40 65 30" fill="#B4E4D6"/><circle cx="50" cy="18" r="15" fill="#FFCA88"/>`;
            } else if (plantStageLevel >= 3) {
                triggerExplosion(window.innerWidth / 2, window.innerHeight / 2, transitionToScreen3);
            }
        }

        function transitionToScreen3() {
            document.getElementById('screen-2').classList.add('hidden');
            document.getElementById('screen-3').classList.remove('hidden');
            document.getElementById('sun-rays').classList.remove('hidden');
            initBlowCandle();
        }

        // --- XỬ LÝ MÀN HÌNH 3: BÁNH KEM & THỔI NẾN ---
        function initBlowCandle() {
            navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const analyser = audioCtx.createAnalyser();
                const microphone = audioCtx.createMediaStreamSource(stream);
                microphone.connect(analyser);
                analyser.fftSize = 256;
                const bufferLength = analyser.frequencyBinCount;
                const dataArray = new Uint8Array(bufferLength);

                function checkWind() {
                    analyser.getByteFrequencyData(dataArray);
                    let sum = dataArray.reduce((a, b) => a + b, 0);
                    let average = sum / bufferLength;

                    if (average > 30) { // Ngưỡng phát hiện thổi qua mic
                        extinguishCandle();
                    } else {
                        requestAnimationFrame(checkWind);
                    }
                }
                checkWind();
            }).catch(err => {
                // Nếu trình duyệt chặn micro, bấm vào bánh kem cũng sẽ tắt nến
                document.getElementById('cake-wrapper').addEventListener('click', extinguishCandle);
            });
        }

        function extinguishCandle() {
            const flame = document.getElementById('flame');
            if (flame) flame.remove();

            // Phát nhạc & hiện thiệp chúc mừng
            const audio = document.getElementById('bday-audio');
            audio.play().catch(() => {});

            document.getElementById('note-card').classList.add('show');
        }
    </script>
</body>
</html>
